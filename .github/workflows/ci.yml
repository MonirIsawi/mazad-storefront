name: CI

# Fork branches (hardening/**) run here too: a PR from a fork waits for the upstream owner to approve
# its workflow run, so pushes are validated in the fork itself. No secrets are used by this workflow.
on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time placeholders only (inlined into the bundle); no real service is contacted.
      NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1
      NEXT_PUBLIC_ASSET_BASE_URL: https://api.example.invalid/assets
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (package-lock.json)
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build
